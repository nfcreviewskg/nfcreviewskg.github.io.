<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lili Mo'tea | Bubble Tea</title>
    <style>
        :root {
            /* Нежная фиолетово-розовая гамма для бабл-ти */
            --brand: #9d4edd; 
            --brand-light: #e0aaff;
            --bg: #f8f0fc; 
            --text: #3c096c; 
            --card: #ffffff;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            /* Легкий паттерн из пузырьков (бабл-ти) */
            background-image: radial-gradient(var(--brand-light) 15%, transparent 16%), radial-gradient(var(--brand-light) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        /* Кнопка возврата */
        .back-btn {
            position: absolute; top: 20px; left: 20px; text-decoration: none;
            color: var(--text); font-size: 0.9rem; opacity: 0.6;
            display: flex; align-items: center; gap: 5px; font-weight: 600; transition: 0.3s;
        }
        .back-btn:hover { opacity: 1; }

        /* Профиль */
        .profile { text-align: center; margin-bottom: 35px; margin-top: 20px; }
        .logo {
            width: 130px; height: 130px; background: var(--card); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 4rem;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.25); margin: 0 auto 20px;
            border: 4px solid var(--brand);
            /* Анимация легкого покачивания */
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 { font-size: 1.9rem; margin: 0 0 5px 0; font-weight: 900; color: var(--brand); letter-spacing: -0.5px; }
        .description { font-size: 1rem; opacity: 0.8; margin: 0; font-weight: 500; }
        
        /* Кнопки */
        .links-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        .link-btn {
            display: flex; align-items: center; padding: 16px 20px; background: var(--card);
            color: var(--text); text-decoration: none; border-radius: 20px; font-weight: 700;
            font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            border: 2px solid transparent;
        }
        .link-btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            border-color: var(--brand); 
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.15); 
        }
        .link-btn span.icon { 
            font-size: 1.4rem; margin-right: 15px; 
            background: var(--bg); padding: 8px; border-radius: 12px;
        }

        /* Специальная кнопка для отзыва */
        .review-btn {
            background: var(--brand);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.4);
        }
        .review-btn span.icon { background: rgba(255,255,255,0.2); }
        .review-btn:hover { 
            border-color: transparent; 
            background: #7b2cbf; 
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.6); 
        }

        /* Подпись */
        .powered-by { margin-top: 60px; font-size: 0.85rem; opacity: 0.5; text-align: center; }
        .powered-by a { color: var(--brand); text-decoration: none; font-weight: 900; }
    </style>
</head>
<body>

    <a href="/" class="back-btn">← На главную QuickTap</a>

    <div class="profile">
        <!-- Иконка бабл-ти -->
        <div class="logo">🧋</div>
        <h1>Lili Mo'tea</h1>
        <p class="description">Свежий бабл-ти и авторские напитки</p>
    </div>

    <div class="links-container">
        
        <!-- Instagram -->
        <a href="#" class="link-btn" target="_blank">
            <span class="icon">📸</span> Мы в Instagram
        </a>
        
        <!-- WhatsApp -->
        <a href="#" class="link-btn" target="_blank">
            <span class="icon">💬</span> Заказать в WhatsApp
        </a>

        <!-- 2ГИС ОТЗЫВ (Выделенная кнопка) -->
        <a href="#" class="link-btn review-btn" target="_blank">
            <span class="icon">⭐</span> Оставить отзыв в 2ГИС
        </a>

        <!-- 2ГИС МАРШРУТ -->
        <a href="#" class="link-btn" target="_blank">
            <span class="icon">📍</span> Как нас найти
        </a>

        <!-- Звонок -->
        <a href="tel:+" class="link-btn">
            <span class="icon">📞</span> Позвонить нам
        </a>
        
    </div>

    <div class="powered-by">
        Работает на технологии <a href="/">QuickTap</a>
    </div>

</body>
</html>
