<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lili Mo'tea | Bubble Tea</title>
    <style>
        :root {
            --brand-orange: #f58220; 
            --brand-green: #3a5f4f; 
            --bg: #fffaf5; 
            --text: #2d3748;
            --card: #ffffff;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(rgba(245, 130, 32, 0.15) 2px, transparent 2px);
            background-size: 25px 25px;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        .back-btn {
            position: absolute; top: 20px; left: 20px; text-decoration: none;
            color: var(--text); font-size: 0.9rem; opacity: 0.6;
            display: flex; align-items: center; gap: 5px; font-weight: 600; transition: 0.3s;
        }
        .back-btn:hover { opacity: 1; color: var(--brand-orange); }

        .profile { text-align: center; margin-bottom: 25px; margin-top: 20px; }
        
        .logo-wrapper {
            width: 120px; height: 120px; background: var(--card); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 10px 30px rgba(245, 130, 32, 0.2); margin: 0 auto 15px;
            border: 4px solid var(--brand-orange);
            overflow: hidden;
            animation: float 4s ease-in-out infinite;
        }
        .logo-wrapper img { width: 80%; height: 80%; object-fit: contain; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 { font-size: 1.9rem; margin: 0 0 5px 0; font-weight: 900; color: var(--brand-orange); letter-spacing: -0.5px; }
        .description { font-size: 0.95rem; opacity: 0.8; margin: 0; font-weight: 500; color: var(--brand-green); }
        
        /* --- БЛОК ОТЗЫВА (Выделенный) --- */
        .review-box {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
            animation: pulse 2s infinite; /* Легкая пульсация, чтобы привлечь внимание */
        }
        
        /* Анимация пульсации для кнопки отзыва */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 130, 32, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 130, 32, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 130, 32, 0); }
        }

        .btn-review-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--brand-orange);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(245, 130, 32, 0.4);
            transition: 0.3s;
        }
        .btn-review-main:hover {
            transform: translateY(-3px) scale(1.02);
            background: #e06c14;
        }
        .btn-review-main img {
            width: 35px; height: 35px;
            background: white; border-radius: 50%; padding: 3px;
        }

        /* --- БЛОК СОЦСЕТЕЙ --- */
        .socials-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .links-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        .link-btn {
            display: flex; align-items: center; padding: 14px 20px; background: var(--card);
            color: var(--text); text-decoration: none; border-radius: 16px; font-weight: 700;
            font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease; border: 2px solid transparent;
        }
        .link-btn:hover { 
            transform: translateY(-2px); 
            border-color: var(--brand-orange); 
            box-shadow: 0 6px 15px rgba(245, 130, 32, 0.15); 
        }
        
        .link-btn .icon-img {
            width: 28px; height: 28px; margin-right: 15px; object-fit: contain; border-radius: 6px;
        }

        .green-btn { background: #eef5f2; color: var(--brand-green); border: 1px solid #d1e0da; }
        .green-btn:hover { border-color: var(--brand-green); background: #e2eee9; }

        .powered-by { margin-top: 50px; font-size: 0.8rem; opacity: 0.5; text-align: center; }
        .powered-by a { color: var(--brand-orange); text-decoration: none; font-weight: 900; }
    </style>
</head>
<body>

    <a href="/" class="back-btn">← На главную QuickTap</a>

    <div class="profile">
        <div class="logo-wrapper">
            <img src="lilimotea-icon.jpg" alt="Lili Mo'tea">
        </div>
        <h1>Lili Mo'tea</h1>
        <p class="description">Свежий бабл-ти и авторские напитки</p>
    </div>

    <!-- ========================================== -->
    <!-- ОТДЕЛЬНЫЙ БЛОК ДЛЯ ОТЗЫВА (Сразу под лого) -->
    <!-- ========================================== -->
    <div class="review-box">
        <a href="#" class="btn-review-main" target="_blank">
            <img src="2gis-icon.png" alt="2ГИС"> 
            Оставить отзыв
        </a>
    </div>

    <!-- Разделитель -->
    <div class="socials-title">Наши соцсети и контакты</div>

    <!-- Блок соцсетей -->
    <div class="links-container">
        
        <a href="#" class="link-btn" target="_blank">
            <img src="inst-icon.png" alt="Instagram" class="icon-img"> 
            Мы в Instagram
        </a>
        
        <a href="#" class="link-btn green-btn" target="_blank">
            <img src="tg-icon.png" alt="Telegram" class="icon-img"> 
            Наш Telegram-канал
        </a>

        <a href="#" class="link-btn" target="_blank">
            <img src="2gis-icon.png" alt="2ГИС" class="icon-img"> 
            Как нас найти (2ГИС)
        </a>

        <a href="tel:+" class="link-btn">
            <img src="2gis-icon.png" alt="Phone" class="icon-img" style="filter: grayscale(1);"> 
            Позвонить нам
        </a>
        
    </div>

    <div class="powered-by">
        Работает на технологии <a href="/">QuickTap</a>
    </div>

</body>
</html>
