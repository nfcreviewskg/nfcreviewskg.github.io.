<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>XAU/USD — Gold Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#131722;color:#d1d4dc;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#topbar{display:flex;align-items:center;gap:8px;padding:0 10px;height:48px;background:#1e222d;border-bottom:1px solid #2a2e39;z-index:100;flex-shrink:0}
.logo{font-weight:700;color:#ffb800;font-size:14px;white-space:nowrap}
#symbol{color:#ffb800;font-weight:600;font-size:14px;white-space:nowrap}
#status{font-size:11px;color:#787b86;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tfToggle{display:none;background:#2a2e39;color:#d1d4dc;border:1px solid #363a45;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:600}
#tfRow{display:flex;gap:1px;background:#2a2e39;border-radius:4px;padding:2px;margin-left:8px}
#tfRow button{background:transparent;color:#787b86;border:0;padding:5px 10px;border-radius:3px;font-size:12px;cursor:pointer}
#tfRow button.active{background:#ffb800;color:#131722}

#main{display:flex;flex:1;overflow:hidden;position:relative;min-height:0}
#leftbar{width:44px;background:#1e222d;border-right:1px solid #2a2e39;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;z-index:15;flex-shrink:0}
#leftbar button{width:32px;height:32px;background:transparent;color:#787b86;border:0;border-radius:4px;font-size:15px;cursor:pointer}
#leftbar button.active{background:#ffb800;color:#131722}
.sep{width:20px;height:1px;background:#363a45;margin:4px 0}

#charts{flex:1;position:relative;background:#131722;min-width:0;min-height:0;overflow:hidden}
#mainChart{position:absolute;inset:0}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none;touch-action:none}
#overlay.draw{pointer-events:auto;cursor:crosshair}

#bottomBar{display:none;height:58px;background:#1e222d;border-top:1px solid #2a2e39;flex-shrink:0;z-index:100;justify-content:space-around;align-items:center;padding:0 3px;padding-bottom:env(safe-area-inset-bottom)}
#bottomBar button{flex:1;height:100%;background:transparent;color:#787b86;border:0;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-width:72px}
#bottomBar button span:last-child{font-size:9px}
#bottomBar button.active{color:#ffb800}

#tfSheet{position:fixed;left:0;right:0;bottom:0;background:#1e222d;border-radius:12px 12px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;z-index:1000;pointer-events:none}
#tfSheet.open{transform:translateY(0);pointer-events:auto}
.grab{width:36px;height:4px;background:#363a45;border-radius:2px;margin:0 auto 15px}
.tfGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tfGrid button{background:#2a2e39;color:#d1d4dc;border:1px solid #363a45;border-radius:6px;padding:14px 0;font-size:14px;font-weight:600}
.tfGrid button.active{background:#ffb800;color:#131722}
.close{position:absolute;right:14px;top:10px;background:none;border:0;color:#aaa;font-size:20px;padding:8px}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none}
#backdrop.show{display:block}

@media(max-width:768px){
 #topbar{height:52px;padding:0 8px;gap:6px}
 .logo,#symbol{font-size:13px}
 #status{display:none}
 #tfRow,#leftbar{display:none}
 #tfToggle{display:block}
 #bottomBar{display:flex}
}
@media(min-width:769px){
 #tfSheet,#backdrop{display:none!important}
}
</style>
</head>

<body>
<div id="app">

 <div id="topbar">
  <span class="logo">◈ Gold</span>
  <span id="symbol">XAU/USD</span>

  <div id="tfRow">
   <button data-tf="1m">1m</button>
   <button data-tf="5m">5m</button>
   <button data-tf="15m">15m</button>
   <button data-tf="30m">30m</button>
   <button data-tf="1h" class="active">1H</button>
   <button data-tf="4h">4H</button>
   <button data-tf="1d">1D</button>
  </div>

  <button id="tfToggle">1H ▾</button>
  <span id="status">Подключение...</span>
 </div>

 <div id="main">

  <div id="leftbar">
   <button data-tool="cursor" class="active">✥</button>
   <div class="sep"></div>
   <button data-tool="trend">╱</button>
   <button data-tool="horiz">─</button>
   <button data-tool="rect">▭</button>
   <button data-tool="fib">F</button>
   <div class="sep"></div>
   <button data-tool="clear">🗑</button>
  </div>

  <div id="charts">
   <div id="mainChart"></div>
   <canvas id="overlay"></canvas>
  </div>

 </div>

 <div id="bottomBar">
  <button data-tool="cursor" class="active">✥<span>Курсор</span></button>
  <button data-tool="trend">╱<span>Тренд</span></button>
  <button data-tool="horiz">─<span>Гориз.</span></button>
  <button data-tool="rect">▭<span>Прямоуг.</span></button>
  <button data-tool="fib">F<span>Фибо</span></button>
  <button data-tool="clear">🗑<span>Очист.</span></button>
 </div>

</div>

<div id="backdrop"></div>
<div id="tfSheet">
 <button class="close" id="tfClose">✕</button>
 <div class="grab"></div>
 <div class="tfGrid">
  <button data-tf="1m">1m</button>
  <button data-tf="5m">5m</button>
  <button data-tf="15m">15m</button>
  <button data-tf="30m">30m</button>
  <button data-tf="1h" class="active">1H</button>
  <button data-tf="4h">4H</button>
  <button data-tf="1d">1D</button>
 </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);

let tf = '1h';
let tool = 'cursor';
let drawings = [];
let current = null;

let chart, candles, overlay, ctx;
let lastBars = [];

let requestController = null;
let requestId = 0;
let pollTimer = null;
let isLoading = false;
let firstLoad = true;

const API = 'https://biquote.io/api/XAUUSD/ohlc';

const labels = {
 '1m':'1m',
 '5m':'5m',
 '15m':'15m',
 '30m':'30m',
 '1h':'1H',
 '4h':'4H',
 '1d':'1D'
};

/* ================= CHART ================= */

function initChart(){

 if(!window.LightweightCharts){
  $('status').textContent='Ошибка библиотеки графика';
  return false;
 }

 chart = LightweightCharts.createChart($('mainChart'),{

  width:$('mainChart').clientWidth,
  height:$('mainChart').clientHeight,

  layout:{
   background:{color:'#131722'},
   textColor:'#d1d4dc',
   fontSize:11
  },

  grid:{
   vertLines:{color:'#1e222d'},
   horzLines:{color:'#1e222d'}
  },

  crosshair:{
   mode:LightweightCharts.CrosshairMode.Normal,
   vertLine:{
    color:'#758696',
    width:1,
    style:2,
    labelBackgroundColor:'#363a45'
   },
   horzLine:{
    color:'#758696',
    width:1,
    style:2,
    labelBackgroundColor:'#363a45'
   }
  },

  rightPriceScale:{
   borderColor:'#363a45',
   scaleMargins:{top:0.05,bottom:0.05}
  },

  timeScale:{
   borderColor:'#363a45',
   timeVisible:true,
   secondsVisible:false,
   rightOffset:6,
   barSpacing:8
  },

  handleScroll:{
   mouseWheel:true,
   pressedMouseMove:true,
   horzTouchDrag:true,
   vertTouchDrag:true
  },

  handleScale:{
   mouseWheel:true,
   pinch:true,
   axisPressedMouseMove:true
  }

 });

 candles = chart.addCandlestickSeries({

  upColor:'#26a69a',
  downColor:'#ef5350',

  borderUpColor:'#26a69a',
  borderDownColor:'#ef5350',

  wickUpColor:'#26a69a',
  wickDownColor:'#ef5350'

 });

 overlay = $('overlay');
 ctx = overlay.getContext('2d');

 chart.timeScale().subscribeVisibleLogicalRangeChange(redraw);

 return true;
}

/* ================= DATA ================= */

function parseTime(k){

 const raw = k.openTime ?? k.time ?? k.t;

 if(typeof raw === 'string'){
  const parsed = Date.parse(raw);
  if(!Number.isNaN(parsed)){
   return Math.floor(parsed/1000);
  }
 }

 const n = Number(raw);

 if(!Number.isFinite(n)) return null;

 return Math.floor(n > 1e12 ? n/1000 : n);
}

function normalizeBars(data){

 let source = [];

 if(Array.isArray(data)){
  source=data;
 }else if(Array.isArray(data.bars)){
  source=data.bars;
 }else if(Array.isArray(data.data)){
  source=data.data;
 }else{
  throw new Error(data.message || data.error || 'Нет массива свечей');
 }

 const result = source.map(k=>{

  const time=parseTime(k);

  const open=Number(k.open ?? k.o);
  const high=Number(k.high ?? k.h);
  const low=Number(k.low ?? k.l);
  const close=Number(k.close ?? k.c);

  if(
   time===null ||
   ![open,high,low,close].every(Number.isFinite) ||
   open<=0 || high<=0 || low<=0 || close<=0 ||
   high<low ||
   high<Math.max(open,close) ||
   low>Math.min(open,close)
  ) return null;

  return {time,open,high,low,close};

 }).filter(Boolean);

 result.sort((a,b)=>a.time-b.time);

 const unique = new Map();

 result.forEach(bar=>{
  unique.set(bar.time,bar);
 });

 return Array.from(unique.values());
}

async function fetchBars(){

 if(isLoading) return;

 isLoading=true;

 const myId=++requestId;

 if(requestController){
  requestController.abort();
 }

 requestController=new AbortController();

 const controller=requestController;

 const url =
  `${API}?interval=${encodeURIComponent(tf)}&limit=500`;

 if(firstLoad){
  $('status').textContent='Загрузка XAU/USD...';
 }

 try{

  const response=await fetch(url,{
   method:'GET',
   signal:controller.signal,
   cache:'no-store'
  });

  if(!response.ok){
   throw new Error('HTTP '+response.status);
  }

  const data=await response.json();

  if(myId!==requestId) return;

  const bars=normalizeBars(data);

  if(!bars.length){
   throw new Error('API не вернул корректные свечи');
  }

  lastBars=bars;

  candles.setData(bars);

  if(firstLoad){
   chart.timeScale().fitContent();
   firstLoad=false;
  }

  const last=bars[bars.length-1];

  $('status').textContent=
   `● XAU/USD · ${last.close.toFixed(2)} · ${bars.length} баров`;

  $('status').style.color='#26a69a';

  redraw();

 }catch(error){

  if(error.name==='AbortError') return;

  console.error('XAU/USD:',error);

  $('status').textContent='Ошибка: '+error.message;
  $('status').style.color='#ef5350';

 }finally{

  if(myId===requestId){
   isLoading=false;
  }

 }

}

/* ================= TIMEFRAMES ================= */

function selectTf(value){

 if(!labels[value] || value===tf) return;

 tf=value;

 firstLoad=true;

 document.querySelectorAll('[data-tf]').forEach(b=>{
  b.classList.toggle('active',b.dataset.tf===tf);
 });

 $('tfToggle').textContent=labels[tf]+' ▾';

 if(requestController){
  requestController.abort();
 }

 isLoading=false;

 fetchBars();

 resetPoll();

}

/* ================= POLLING ================= */

function resetPoll(){

 if(pollTimer) clearInterval(pollTimer);

 pollTimer=setInterval(()=>{

  if(!isLoading){
   fetchBars();
  }

 },15000);

}

/* ================= DRAWING ================= */

function redraw(){

 if(!ctx || !chart) return;

 const w=overlay.width/(devicePixelRatio||1);
 const h=overlay.height/(devicePixelRatio||1);

 ctx.clearRect(0,0,w,h);

 drawings.forEach(d=>drawShape(d,false));

 if(current) drawShape(current,true);

}

function drawShape(d,preview){

 const color=preview?
  'rgba(255,184,0,0.9)':'#ffb800';

 ctx.strokeStyle=color;
 ctx.fillStyle=color;
 ctx.lineWidth=1.5;
 ctx.font='11px sans-serif';

 const ts=chart.timeScale();
 const w=overlay.width/(devicePixelRatio||1);

 if(d.type==='horiz'){

  const y=candles.priceToCoordinate(d.p1.price);

  if(y==null) return;

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(w,y);
  ctx.stroke();

  const label=d.p1.price.toFixed(2);

  ctx.fillStyle='#ffb800';
  ctx.fillRect(2,y-15,ctx.measureText(label).width+9,14);

  ctx.fillStyle='#131722';
  ctx.fillText(label,6,y-5);

  return;
 }

 const x1=ts.timeToCoordinate(d.p1.time);
 const y1=candles.priceToCoordinate(d.p1.price);
 const x2=ts.timeToCoordinate(d.p2.time);
 const y2=candles.priceToCoordinate(d.p2.price);

 if([x1,y1,x2,y2].some(v=>v==null)) return;

 if(d.type==='trend'){

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

 }

 if(d.type==='rect'){

  const left=Math.min(x1,x2);
  const top=Math.min(y1,y2);
  const width=Math.abs(x2-x1);
  const height=Math.abs(y2-y1);

  ctx.fillStyle='rgba(255,184,0,0.10)';
  ctx.fillRect(left,top,width,height);

  ctx.strokeStyle=color;
  ctx.strokeRect(left,top,width,height);

 }

 if(d.type==='fib'){

  const left=Math.min(x1,x2);
  const right=Math.max(x1,x2);

  const levels=[0,0.236,0.382,0.5,0.618,0.786,1];

  levels.forEach(level=>{

   const price=
    d.p1.price+(d.p2.price-d.p1.price)*level;

   const y=candles.priceToCoordinate(price);

   if(y==null) return;

   ctx.strokeStyle=
    level===0||level===1?
    color:'rgba(255,184,0,0.6)';

   ctx.beginPath();
   ctx.moveTo(left,y);
   ctx.lineTo(right,y);
   ctx.stroke();

   ctx.fillStyle='#ffb800';

   ctx.fillText(
    `${(level*100).toFixed(1)}%  ${price.toFixed(2)}`,
    left+4,
    y-4
   );

  });

  ctx.setLineDash([3,3]);

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.setLineDash([]);

 }

}

/* ================= POINTER ================= */

function getPoint(e){

 const r=overlay.getBoundingClientRect();

 const x=e.clientX-r.left;
 const y=e.clientY-r.top;

 const time=chart.timeScale().coordinateToTime(x);
 const price=candles.coordinateToPrice(y);

 if(time===null || time===undefined || price===null || price===undefined){
  return null;
 }

 return {time,price};

}

function startDraw(e){

 if(tool==='cursor') return;

 if(e.pointerType==='mouse' && e.button!==0) return;

 const p=getPoint(e);

 if(!p) return;

 e.preventDefault();

 try{
  overlay.setPointerCapture(e.pointerId);
 }catch(err){}

 if(tool==='horiz'){

  drawings.push({
   type:'horiz',
   p1:p
  });

  redraw();
  return;

 }

 current={
  type:tool,
  p1:p,
  p2:p
 };

 redraw();

}

function moveDraw(e){

 if(!current) return;

 e.preventDefault();

 const p=getPoint(e);

 if(p){
  current.p2=p;
  redraw();
 }

}

function endDraw(e){

 if(!current) return;

 const p=getPoint(e);

 if(p) current.p2=p;

 drawings.push(current);

 current=null;

 redraw();

}

overlay.addEventListener('pointerdown',startDraw);
overlay.addEventListener('pointermove',moveDraw);
overlay.addEventListener('pointerup',endDraw);
overlay.addEventListener('pointercancel',endDraw);

/* ================= TOOL SELECT ================= */

function selectTool(t){

 tool=t;

 document.querySelectorAll('[data-tool]').forEach(b=>{
  b.classList.toggle('active',b.dataset.tool===t);
 });

 overlay.classList.toggle('draw',t!=='cursor');

}

document.querySelectorAll('[data-tool]').forEach(b=>{

 b.addEventListener('click',()=>{

  const t=b.dataset.tool;

  if(t==='clear'){

   drawings=[];
   current=null;
   redraw();
   return;

  }

  selectTool(t);

 });

});

/* ================= MOBILE SHEET ================= */

function openSheet(){

 $('tfSheet').classList.add('open');
 $('backdrop').classList.add('show');

}

function closeSheet(){

 $('tfSheet').classList.remove('open');
 $('backdrop').classList.remove('show');

}

$('tfToggle').addEventListener('click',openSheet);

$('backdrop').addEventListener('click',closeSheet);

$('tfClose').addEventListener('click',closeSheet);

document.querySelectorAll('#tfSheet [data-tf]').forEach(b=>{

 b.addEventListener('click',()=>{

  selectTf(b.dataset.tf);
  closeSheet();

 });

});

/* ================= DESKTOP TF ================= */

document.querySelectorAll('#tfRow [data-tf]').forEach(b=>{

 b.addEventListener('click',()=>{
  selectTf(b.dataset.tf);
 });

});

/* ================= RESIZE ================= */

function resize(){

 if(!chart) return;

 const el=$('mainChart');

 const w=el.clientWidth;
 const h=el.clientHeight;

 if(w<=0||h<=0) return;

 chart.resize(w,h);

 const dpr=window.devicePixelRatio||1;

 overlay.width=Math.round(w*dpr);
 overlay.height=Math.round(h*dpr);

 overlay.style.width=w+'px';
 overlay.style.height=h+'px';

 ctx.setTransform(dpr,0,0,dpr,0,0);

 redraw();

}

const resizeObserver=new ResizeObserver(resize);
resizeObserver.observe($('charts'));

window.addEventListener('resize',resize);

/* ================= BOOT ================= */

function boot(){

 if(!initChart()) return;

 resize();

 fetchBars();

 resetPoll();

}

requestAnimationFrame(boot);

})();
</script>
</body>
</html>
