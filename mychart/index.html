
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAU/USD — Trading Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e11;color:#e5e7eb;font-family:Arial,sans-serif;overflow:hidden}
.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #242a32}
.logo{font-size:19px;font-weight:bold}
.instrument{font-size:13px;color:#8b949e;margin-top:4px}
.price-box{text-align:right}
.price{font-size:20px;font-weight:bold}
.change{font-size:12px;margin-top:4px;color:#26a69a}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:12px 16px;border-bottom:1px solid #242a32}
button{background:#171c23;color:#aeb6c2;border:1px solid #303844;border-radius:5px;padding:8px 13px;cursor:pointer;font-size:13px}
button:hover{background:#252d38;color:white}
button.active{background:#2962ff;color:white;border-color:#2962ff}
.separator{width:1px;height:25px;background:#303844;margin:0 5px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:11px;color:#788492}
.status-left{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#e0a43b}
.dot.connected{background:#26a69a}
.dot.error{background:#ef5350}
#chart{width:100%;height:calc(100vh - 150px);min-height:300px}
@media(max-width:600px){
.topbar{height:58px;padding:0 12px}
.logo{font-size:16px}
.price{font-size:17px}
.toolbar{padding:9px;gap:5px}
button{padding:8px 10px;font-size:12px}
#chart{height:calc(100vh - 155px)}
.statusbar{padding:7px 10px}
}
</style>
</head>
<body>

<header class="topbar">
 <div>
  <div class="logo">XAU/USD</div>
  <div class="instrument">Gold / US Dollar</div>
 </div>
 <div class="price-box">
  <div class="price" id="price">---</div>
  <div class="change" id="change">Ожидание данных</div>
 </div>
</header>

<div class="toolbar" id="timeframes">
 <button data-tf="1min" class="active">1m</button>
 <button data-tf="5min">5m</button>
 <button data-tf="15min">15m</button>
 <button data-tf="30min">30m</button>
 <button data-tf="1h">1H</button>
 <button data-tf="4h">4H</button>
 <button data-tf="1day">1D</button>
 <div class="separator"></div>
 <button id="fitButton">Весь график</button>
</div>

<div class="statusbar">
 <div class="status-left">
  <span class="dot" id="statusDot"></span>
  <span id="status">Подключение к Twelve Data...</span>
 </div>
 <span id="lastUpdate">--:--:--</span>
</div>

<div id="chart"></div>

<script>
const API_KEY = "0ec885e9044e459d92e9b6cb646eb3c7";
const API_URL = "https://api.twelvedata.com/time_series";
const SYMBOL = "XAU/USD";
const UPDATE_INTERVAL = 15000;

const chartElement = document.getElementById("chart");

const chart = LightweightCharts.createChart(chartElement,{
 width:chartElement.clientWidth,
 height:chartElement.clientHeight,
 layout:{
  background:{color:"#0b0e11"},
  textColor:"#d1d4dc",
  fontSize:12
 },
 grid:{
  vertLines:{color:"#171c23"},
  horzLines:{color:"#171c23"}
 },
 crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
 rightPriceScale:{
  borderColor:"#303844",
  scaleMargins:{top:0.1,bottom:0.1}
 },
 timeScale:{
  borderColor:"#303844",
  timeVisible:true,
  secondsVisible:false,
  rightOffset:8,
  barSpacing:8
 },
 handleScroll:true,
 handleScale:true
});

const candleSeries = chart.addCandlestickSeries({
 upColor:"#26a69a",
 downColor:"#ef5350",
 borderUpColor:"#26a69a",
 borderDownColor:"#ef5350",
 wickUpColor:"#26a69a",
 wickDownColor:"#ef5350",
 priceLineVisible:true,
 lastValueVisible:true
});

let currentTimeframe = "1min";
let updateTimer = null;
let isLoading = false;

const priceElement = document.getElementById("price");
const changeElement = document.getElementById("change");
const statusElement = document.getElementById("status");
const statusDot = document.getElementById("statusDot");
const lastUpdateElement = document.getElementById("lastUpdate");

function setStatus(message,type){
 statusElement.textContent=message;
 statusDot.className="dot";
 if(type==="connected") statusDot.classList.add("connected");
 if(type==="error") statusDot.classList.add("error");
}

function parseApiDate(value){
 const normalized=value.includes("T")?value:value.replace(" ","T");
 const timestamp=Date.parse(normalized);
 return Number.isFinite(timestamp)?Math.floor(timestamp/1000):NaN;
}

function updatePrice(last,first){
 priceElement.textContent=last.close.toFixed(2);
 priceElement.style.color=last.close>=last.open?"#26a69a":"#ef5350";

 if(first && first.open!==0){
  const percent=((last.close-first.open)/first.open)*100;
  changeElement.textContent=(percent>=0?"+":"")+percent.toFixed(2)+"%";
  changeElement.style.color=percent>=0?"#26a69a":"#ef5350";
 }
}

async function loadCandles(){
 if(isLoading)return;
 isLoading=true;

 try{
  setStatus("Загрузка котировок...","loading");

  const params=new URLSearchParams({
   symbol:SYMBOL,
   interval:currentTimeframe,
   outputsize:"500",
   order:"asc",
   apikey:API_KEY
  });

  const response=await fetch(API_URL+"?"+params.toString());
  if(!response.ok)throw new Error("HTTP ошибка: "+response.status);

  const data=await response.json();

  if(data.status==="error" || data.code){
   throw new Error(data.message||"Ошибка Twelve Data");
  }

  if(!data.values || !Array.isArray(data.values)){
   throw new Error("API не вернул данные свечей");
  }

  const candles=data.values.map(item=>({
   time:parseApiDate(item.datetime),
   open:Number(item.open),
   high:Number(item.high),
   low:Number(item.low),
   close:Number(item.close)
  })).filter(item=>
   Number.isFinite(item.time)&&
   Number.isFinite(item.open)&&
   Number.isFinite(item.high)&&
   Number.isFinite(item.low)&&
   Number.isFinite(item.close)
  ).sort((a,b)=>a.time-b.time);

  if(!candles.length)throw new Error("Нет корректных свечей");

  candleSeries.setData(candles);

  const last=candles[candles.length-1];
  const first=candles[0];

  updatePrice(last,first);
  lastUpdateElement.textContent=new Date().toLocaleTimeString();

  setStatus("Подключено • "+candles.length+" свечей","connected");

 }catch(error){
  console.error("XAU/USD API:",error);
  setStatus(error.message,"error");
 }finally{
  isLoading=false;
 }
}

function selectTimeframe(timeframe){
 currentTimeframe=timeframe;

 document.querySelectorAll("#timeframes button[data-tf]").forEach(button=>{
  button.classList.toggle("active",button.dataset.tf===timeframe);
 });

 clearInterval(updateTimer);
 candleSeries.setData([]);
 loadCandles();
 updateTimer=setInterval(loadCandles,UPDATE_INTERVAL);
}

document.querySelectorAll("#timeframes button[data-tf]").forEach(button=>{
 button.addEventListener("click",()=>selectTimeframe(button.dataset.tf));
});

document.getElementById("fitButton").addEventListener("click",()=>{
 chart.timeScale().fitContent();
});

const resizeObserver=new ResizeObserver(()=>{
 chart.applyOptions({
  width:chartElement.clientWidth,
  height:chartElement.clientHeight
 });
});

resizeObserver.observe(chartElement);

selectTimeframe("1min");
</script>
</body>
</html>
