<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTap | Партнеры</title>
    <!-- Иконка главного сайта -->
    <link rel="icon" type="image/png" href="logo-quicktap.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-purple: #8568A6; 
            --bg: #F8F6FB; 
            --text: #2d3748;
            --card: #ffffff;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(rgba(133, 104, 166, 0.1) 2px, transparent 2px);
            background-size: 25px 25px;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Шапка главного сайта */
        .header {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 20px;
        }

        .main-logo {
            height: 60px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--brand-purple);
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1rem;
            color: #777;
            margin: 0;
            font-weight: 500;
        }

        /* Сетка партнеров */
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* Карточка партнера */
        .partner-card {
            background: var(--card);
            border-radius: 20px;
            padding: 25px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .partner-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(133, 104, 166, 0.15);
            border-color: var(--brand-purple);
        }

        /* Логотип внутри карточки */
        .partner-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }

        .partner-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--brand-purple);
        }

        .partner-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
        }

        /* Подвал */
        .footer {
            margin-top: auto;
            padding-top: 50px;
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Логотип QuickTap в шапке. Если файла нет, покажется текст -->
        <img src="logo-quicktap.png" alt="QuickTap" class="main-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <h1 style="display:none; font-size: 2.5rem; margin-bottom: 10px;">QuickTap</h1>
        <p>Все ваши любимые бренды в одном месте</p>
    </div>

    <div class="partners-grid">
        
        <!-- КАРТОЧКА 1: ASDEM -->
        <a href="/asdem-optom/" class="partner-card">
            <img src="/asdem-optom/logo-asdem.png" alt="ASDEM" class="partner-logo" onerror="this.src='https://via.placeholder.com/70/8568A6/ffffff?text=A';">
            <div class="partner-info">
                <h3>ASDEM</h3>
                <p>Оптовая одежда и пижамы</p>
            </div>
        </a>

        <!-- КАРТОЧКА 2: LILI MO'TEA (для примера, как было раньше) -->
        <a href="/lilimotea/" class="partner-card">
            <img src="/lilimotea/lilimotea-icon.jpg" alt="Lili Mo'tea" class="partner-logo" onerror="this.src='https://via.placeholder.com/70/f58220/ffffff?text=L';">
            <div class="partner-info">
                <h3>Lili Mo'tea</h3>
                <p>Свежий бабл-ти и напитки</p>
            </div>
        </a>

        <!-- Сюда можешь добавлять новых партнеров по такому же принципу -->
        <!-- 
        <a href="/имя-папки/" class="partner-card">
            <img src="/имя-папки/лого.png" alt="Название" class="partner-logo">
            <div class="partner-info">
                <h3>Название</h3>
                <p>Описание бренда</p>
            </div>
        </a>
        -->

    </div>

    <div class="footer">
        &copy; 2024 QuickTap. Все права защищены.
    </div>

</body>
</html>
